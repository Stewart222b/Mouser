name: Master4 Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-master4.txt
      - name: Test input, haptics, updates and packaging
        run: >-
          python -m unittest
          tests.test_ctrl_left_click tests.test_ctrl_click_profiles
          tests.test_mouse_mapping_haptics tests.test_screen_haptics tests.test_engine
          tests.test_key_simulator tests.test_spec_coverage
          tests.test_updater tests.test_update_installer
          tests.test_locale_manager tests.test_localization
      - name: Build portable app
        run: python -m PyInstaller Mouser.spec --noconfirm
      - name: Include license and project documentation
        shell: pwsh
        run: |
          Copy-Item -LiteralPath LICENSE -Destination dist/Mouser/LICENSE
          Copy-Item -LiteralPath README.md -Destination dist/Mouser/README.md
          Copy-Item -LiteralPath ACKNOWLEDGMENTS.md -Destination dist/Mouser/ACKNOWLEDGMENTS.md
          Copy-Item -LiteralPath CUSTOMIZATIONS.md -Destination dist/Mouser/CUSTOMIZATIONS.md
          Compress-Archive -Path dist/Mouser -DestinationPath Mouser-Windows.zip
      - uses: actions/upload-artifact@v7
        with:
          name: Mouser-Master4-Windows
          path: Mouser-Windows.zip
