<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>G502 X PLUS 按键视图预览</title>
  <style>
    :root {
      --bg: #202020;
      --elevated: #282828;
      --hover: #353535;
      --input: #202020;
      --accent: #9ec2e3;
      --accent-hover: #b6d4ef;
      --accent-dim: #33404b;
      --text: #ececec;
      --text-2: #b0b0b0;
      --text-3: #999999;
      --border: #444444;
      --dot-fill: #f6f8fc;
      --dot-stroke: #26374a;
      --danger: #ff6b6b;
      --radius: 6px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    }
    ::selection { background: var(--accent-dim); color: var(--text); }
    button, select { font: inherit; color: inherit; }
    body {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100%;
    }
    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 32px 14px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    header > div:first-child {
      flex: 1;
      min-width: 240px;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      word-break: keep-all;
    }
    .sub {
      margin: 4px 0 0;
      color: var(--text-2);
      font-size: 13px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }
    .btn {
      height: 36px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--elevated);
      cursor: pointer;
    }
    .btn:hover { background: var(--hover); }
    .btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .btn.primary {
      background: var(--accent-dim);
      border-color: transparent;
      color: var(--accent);
    }
    .btn[aria-pressed="true"] {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }
    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 24px;
      padding: 20px 32px 32px;
      max-width: 1280px;
      width: 100%;
    }
    .stage-wrap {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 0;
    }
    .view-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 8px;
    }
    .view-label {
      min-width: 148px;
      text-align: center;
      font-weight: 600;
    }
    .chev {
      width: 40px;
      height: 40px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--elevated);
      display: grid;
      place-items: center;
      cursor: pointer;
      color: var(--text);
    }
    .chev:hover { background: var(--hover); color: var(--accent); }
    .chev:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .chev svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; }
    .stage {
      position: relative;
      min-height: 540px;
      background: var(--bg);
      overflow: hidden;
    }
    .stage img {
      position: absolute;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }
    .hotspot {
      position: absolute;
      width: 44px;
      height: 44px;
      margin: -22px 0 0 -22px;
      border: 0;
      background: transparent;
      cursor: pointer;
      padding: 0;
    }
    .hotspot .ring {
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      border: 2px solid transparent;
    }
    .hotspot .dot {
      position: absolute;
      inset: 13px;
      border-radius: 50%;
      background: var(--dot-fill);
      border: 3px solid var(--dot-stroke);
    }
    .hotspot:hover .dot,
    .hotspot:focus-visible .dot { transform: scale(1.15); }
    .hotspot.is-selected .dot {
      background: var(--accent);
      border-color: var(--dot-stroke);
    }
    .hotspot.is-selected .ring {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 18%, transparent);
    }
    .hotspot:focus-visible { outline: none; }
    .align-on .hotspot { cursor: grab; }
    .align-on .hotspot.is-dragging { cursor: grabbing; }
    .callout {
      position: absolute;
      pointer-events: none;
      z-index: 3;
    }
    .callout .line {
      position: absolute;
      height: 1px;
      background: var(--accent);
      transform-origin: 0 50%;
    }
    .callout .tag {
      position: absolute;
      padding: 6px 10px;
      border-radius: 4px;
      background: var(--accent-dim);
      border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
      white-space: nowrap;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
    }
    .hint {
      margin-top: 10px;
      color: var(--text-3);
      font-size: 12px;
      text-align: center;
    }
    aside {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }
    aside h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
    }
    .panel {
      background: var(--elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
    }
    .empty {
      color: var(--text-2);
      font-size: 13px;
    }
    .meta {
      display: grid;
      gap: 4px;
      color: var(--text-2);
      font-size: 12px;
    }
    .meta strong { color: var(--text); font-weight: 600; }
    .list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .list button {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      border-radius: 4px;
      padding: 8px 8px;
      cursor: pointer;
    }
    .list button:hover { background: var(--hover); }
    .list button.is-active { background: var(--accent-dim); color: var(--accent); }
    .list .coord {
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
      font-size: 11px;
    }
    textarea {
      width: 100%;
      min-height: 160px;
      resize: vertical;
      background: var(--input);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px;
      font: 11px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace;
    }
    .row { display: flex; gap: 8px; }
    .row .btn { flex: 1; }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
      .stage { min-height: 420px; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>G502 X PLUS 按键视图</h1>
      <p class="sub">对照 G Hub：视图 1 正面，视图 2 侧面放 G4 / G5 / DPI Shift。对齐后再迁回 app。</p>
    </div>
    <div class="toolbar">
      <button class="btn" id="alignBtn" type="button" aria-pressed="false">对齐模式</button>
      <button class="btn" id="oldBtn" type="button" aria-pressed="false">显示旧坐标</button>
      <button class="btn primary" id="copyBtn" type="button">复制坐标</button>
    </div>
  </header>
  <main>
    <section class="stage-wrap">
      <div class="view-bar">
        <button class="chev" id="prevBtn" type="button" aria-label="上一视图">
          <svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg>
        </button>
        <div class="view-label" id="viewLabel">视图 1 · 正面</div>
        <button class="chev" id="nextBtn" type="button" aria-label="下一视图">
          <svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5"/></svg>
        </button>
      </div>
      <div class="stage" id="stage">
        <img id="mouse" alt="G502 X PLUS">
      </div>
      <p class="hint" id="hint">点选圆点查看按键。打开对齐模式后可拖动，方向键每次移动 0.002。</p>
    </section>
    <aside>
      <div class="panel">
        <h2 id="selTitle">选择鼠标上的按键</h2>
        <p class="empty" id="selEmpty">在此核对该点是否落在实体键上。</p>
        <div class="meta" id="selMeta" hidden></div>
      </div>
      <div class="panel">
        <h2>这一视图的按键</h2>
        <div class="list" id="list"></div>
      </div>
      <div class="panel">
        <h2>导出</h2>
        <textarea id="export" spellcheck="false" readonly></textarea>
        <div class="row" style="margin-top:8px">
          <button class="btn" id="resetBtn" type="button">恢复预览坐标</button>
        </div>
      </div>
    </aside>
  </main>
  <script>
    const IMG = {
      top: "../../images/logitech-mice/g502_x_plus/mouse.png",
      side: "../../images/logitech-mice/g502_x_plus/side.png",
    };

    const OLD_TOP = [
      { key: "g502_dpi_up", label: "DPI 加 (G8)", g: "G8", x: 0.255, y: 0.238, side: "left", ox: -80, oy: -18 },
      { key: "g502_dpi_down", label: "DPI 减 (G7)", g: "G7", x: 0.272, y: 0.300, side: "left", ox: -80, oy: 22 },
      { key: "middle", label: "中键", g: "G3", x: 0.572, y: 0.272, side: "right", ox: 85, oy: -40 },
      { key: "hscroll_left", label: "水平滚动", g: "Tilt", x: 0.448, y: 0.268, side: "right", ox: 95, oy: 25, hscroll: true },
      { key: "g502_profile", label: "配置键 (G9)", g: "G9", x: 0.550, y: 0.472, side: "right", ox: 80, oy: 20 },
    ];

    const NEW_TOP = [
      { key: "g502_dpi_up", label: "DPI 加 (G8)", g: "G8", x: 0.253, y: 0.209, side: "left", ox: -80, oy: -18 },
      { key: "g502_dpi_down", label: "DPI 减 (G7)", g: "G7", x: 0.211, y: 0.354, side: "left", ox: -80, oy: 22 },
      { key: "middle", label: "中键", g: "G3", x: 0.571, y: 0.271, side: "right", ox: 85, oy: -40 },
      { key: "g502_profile", label: "配置键 (G9)", g: "G9", x: 0.571, y: 0.473, side: "right", ox: 80, oy: 20 },
    ];

    const NEW_SIDE = [
      { key: "g502_dpi_shift", label: "DPI Shift 键", g: "G6", x: 0.377, y: 0.697, side: "left", ox: -90, oy: 24 },
      { key: "xbutton2", label: "前进键 (G5)", g: "G5", x: 0.479, y: 0.474, side: "right", ox: 90, oy: -32 },
      { key: "xbutton1", label: "后退键 (G4)", g: "G4", x: 0.622, y: 0.425, side: "right", ox: 90, oy: 22 },
    ];

    const views = [
      { id: "top", title: "视图 1 · 正面", image: IMG.top, note: "G7 / G8 / G9 / 中键。滚轮左右倾斜在中键里配置。" },
      { id: "side", title: "视图 2 · 侧面", image: IMG.side, note: "G Hub 第二视图：G4 后退、G5 前进、G6 DPI Shift" },
    ];

    const state = {
      view: 0,
      selected: null,
      align: false,
      showOld: false,
      layout: null,
      dragging: null,
    };

    const $ = (id) => document.getElementById(id);
    const stage = $("stage");
    const img = $("mouse");
    const clone = (rows) => rows.map((r) => ({ ...r }));
    let live = { top: clone(NEW_TOP), side: clone(NEW_SIDE) };

    function currentHotspots() {
      if (state.view === 0 && state.showOld) return OLD_TOP;
      return live[views[state.view].id];
    }

    function layoutImage() {
      const sw = stage.clientWidth;
      const sh = stage.clientHeight;
      const nw = img.naturalWidth;
      const nh = img.naturalHeight;
      if (!nw || !nh) return null;
      const scale = Math.min(sw / nw, sh / nh);
      const pw = nw * scale;
      const ph = nh * scale;
      const ox = (sw - pw) / 2;
      const oy = (sh - ph) / 2;
      img.style.width = `${pw}px`;
      img.style.height = `${ph}px`;
      img.style.left = `${ox}px`;
      img.style.top = `${oy}px`;
      state.layout = { ox, oy, pw, ph };
      return state.layout;
    }

    function renderHotspots() {
      stage.querySelectorAll(".hotspot, .callout").forEach((n) => n.remove());
      const L = layoutImage();
      if (!L) return;
      const spots = currentHotspots();
      spots.forEach((spot) => {
        const btn = document.createElement("button");
        btn.className = "hotspot" + (state.selected === spot.key ? " is-selected" : "");
        btn.type = "button";
        btn.dataset.key = spot.key;
        btn.setAttribute("aria-label", `${spot.g} ${spot.label}`);
        btn.style.left = `${L.ox + spot.x * L.pw}px`;
        btn.style.top = `${L.oy + spot.y * L.ph}px`;
        btn.innerHTML = `<span class="ring"></span><span class="dot"></span>`;
        btn.addEventListener("pointerdown", (ev) => onPointerDown(ev, spot));
        btn.addEventListener("click", () => select(spot.key));
        stage.appendChild(btn);
      });
      const selected = spots.find((s) => s.key === state.selected);
      if (selected) drawCallout(selected, L);
      renderList();
      renderExport();
      renderSelection();
    }

    function drawCallout(spot, L) {
      const cx = L.ox + spot.x * L.pw;
      const cy = L.oy + spot.y * L.ph;
      const box = document.createElement("div");
      box.className = "callout";
      const tag = document.createElement("div");
      tag.className = "tag";
      tag.textContent = `${spot.g}  ${spot.label}`;
      box.appendChild(tag);
      stage.appendChild(box);
      const tw = tag.offsetWidth;
      const th = tag.offsetHeight;
      let tx = spot.side === "left" ? cx + spot.ox - tw : cx + spot.ox;
      let ty = cy + spot.oy - th / 2;
      tx = Math.max(8, Math.min(stage.clientWidth - tw - 8, tx));
      ty = Math.max(8, Math.min(stage.clientHeight - th - 8, ty));
      tag.style.left = `${tx}px`;
      tag.style.top = `${ty}px`;
      const line = document.createElement("div");
      line.className = "line";
      const x2 = tx + tw / 2;
      const y2 = ty + th / 2;
      const dx = x2 - cx;
      const dy = y2 - cy;
      const len = Math.hypot(dx, dy);
      line.style.left = `${cx}px`;
      line.style.top = `${cy}px`;
      line.style.width = `${len}px`;
      line.style.transform = `rotate(${Math.atan2(dy, dx)}rad)`;
      box.appendChild(line);
    }

    function select(key) {
      state.selected = key;
      renderHotspots();
    }

    function renderList() {
      const spots = currentHotspots();
      $("list").innerHTML = spots.map((s) => `
        <button type="button" data-key="${s.key}" class="${s.key === state.selected ? "is-active" : ""}">
          <span>${s.g} · ${s.label}</span>
          <span class="coord">${s.x.toFixed(3)}, ${s.y.toFixed(3)}</span>
        </button>`).join("");
      $("list").querySelectorAll("button").forEach((b) => {
        b.addEventListener("click", () => select(b.dataset.key));
      });
    }

    function renderSelection() {
      const view = views[state.view];
      $("viewLabel").textContent = view.title;
      $("hint").textContent = state.align
        ? "对齐模式：拖动圆点。方向键微移 0.002，Shift 为 0.010。"
        : view.note + "。点左右箭头切换视图。";
      const spot = currentHotspots().find((s) => s.key === state.selected);
      if (!spot) {
        $("selTitle").textContent = "选择鼠标上的按键";
        $("selEmpty").hidden = false;
        $("selMeta").hidden = true;
        return;
      }
      $("selEmpty").hidden = true;
      $("selMeta").hidden = false;
      $("selTitle").textContent = spot.label;
      $("selMeta").innerHTML = `
        <div><strong>${spot.g}</strong> · ${spot.key}</div>
        <div>normX ${spot.x.toFixed(3)}　normY ${spot.y.toFixed(3)}</div>
        <div>${view.title}</div>`;
    }

    function pyLine(spot) {
      const extra = spot.hscroll ? ",\n                is_hscroll=True" : "";
      return `            _hotspot(
                "${spot.key}",
                "${spot.label}",
                "${spot.hscroll ? "hscroll" : "mapping"}",
                ${spot.x.toFixed(3)},
                ${spot.y.toFixed(3)},
                label_side="${spot.side}",
                label_off_x=${spot.ox},
                label_off_y=${spot.oy}${extra},
            )`;
    }

    function renderExport() {
      const top = live.top.map(pyLine).join(",\n");
      const side = live.side.map(pyLine).join(",\n");
      $("export").value =
        `# view top (mouse.png)\n${top}\n\n# view side (side.png)\n${side}\n`;
    }

    async function setView(i) {
      state.view = (i + views.length) % views.length;
      state.selected = null;
      $("viewLabel").textContent = views[state.view].title;
      img.src = views[state.view].image;
      try { await img.decode(); } catch (err) {}
      renderHotspots();
    }

    function onPointerDown(ev, spot) {
      if (!state.align || state.showOld) return;
      ev.preventDefault();
      state.dragging = spot;
      ev.currentTarget.classList.add("is-dragging");
      ev.currentTarget.setPointerCapture(ev.pointerId);
    }

    stage.addEventListener("pointermove", (ev) => {
      if (!state.dragging || !state.layout) return;
      const rect = stage.getBoundingClientRect();
      const { ox, oy, pw, ph } = state.layout;
      state.dragging.x = Math.min(1, Math.max(0, (ev.clientX - rect.left - ox) / pw));
      state.dragging.y = Math.min(1, Math.max(0, (ev.clientY - rect.top - oy) / ph));
      renderHotspots();
    });
    window.addEventListener("pointerup", () => { state.dragging = null; });

    window.addEventListener("keydown", (ev) => {
      if (ev.key === "ArrowLeft" && !state.align) { setView(state.view - 1); return; }
      if (ev.key === "ArrowRight" && !state.align) { setView(state.view + 1); return; }
      if (!state.align || !state.selected || state.showOld) return;
      const spot = currentHotspots().find((s) => s.key === state.selected);
      if (!spot) return;
      const step = ev.shiftKey ? 0.010 : 0.002;
      if (ev.key === "ArrowLeft") { spot.x = Math.max(0, spot.x - step); ev.preventDefault(); }
      if (ev.key === "ArrowRight") { spot.x = Math.min(1, spot.x + step); ev.preventDefault(); }
      if (ev.key === "ArrowUp") { spot.y = Math.max(0, spot.y - step); ev.preventDefault(); }
      if (ev.key === "ArrowDown") { spot.y = Math.min(1, spot.y + step); ev.preventDefault(); }
      renderHotspots();
    });

    $("prevBtn").onclick = () => setView(state.view - 1);
    $("nextBtn").onclick = () => setView(state.view + 1);
    $("alignBtn").onclick = () => {
      state.align = !state.align;
      $("alignBtn").setAttribute("aria-pressed", String(state.align));
      document.body.classList.toggle("align-on", state.align);
      renderHotspots();
    };
    $("oldBtn").onclick = () => {
      state.showOld = !state.showOld;
      $("oldBtn").setAttribute("aria-pressed", String(state.showOld));
      if (state.showOld) { state.view = 0; img.src = IMG.top; }
      else renderHotspots();
    };
    $("resetBtn").onclick = () => {
      live = { top: clone(NEW_TOP), side: clone(NEW_SIDE) };
      renderHotspots();
    };
    $("copyBtn").onclick = async () => {
      await navigator.clipboard.writeText($("export").value);
      $("copyBtn").textContent = "已复制";
      setTimeout(() => { $("copyBtn").textContent = "复制坐标"; }, 1200);
    };

    img.addEventListener("load", renderHotspots);
    window.addEventListener("resize", renderHotspots);
    img.src = IMG.top;
  </script>
</body>
</html>
